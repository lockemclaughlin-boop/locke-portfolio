<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Vidconvert Studios — Performance marketing for impactful brands</title>
  <meta name="description" content="Vidconvert Studios is a performance marketing agency for ambitious DTC and lead-gen brands. Specialists in Meta ads, creative, and full-funnel growth." />
  <link rel="stylesheet" href="styles.css" />
  <style>
    .video-card { position: relative; border-radius: 20px; overflow: hidden; background: var(--bg-2); border: 1px solid var(--line); cursor: pointer; }
    .video-card video { width: 100%; height: 100%; object-fit: cover; display: block; }
    .video-card .vc-overlay { position: absolute; inset: 0; background: linear-gradient(to bottom, transparent 40%, rgba(14,13,11,0.9) 100%); display: flex; flex-direction: column; justify-content: flex-end; padding: 20px; pointer-events: none; }
    .video-card .vc-play { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; opacity: 0; transition: opacity 0.2s; pointer-events: none; }
    .video-card:hover .vc-play { opacity: 1; }
    .video-card .vc-play-btn { width: 52px; height: 52px; border-radius: 50%; background: rgba(244,239,230,0.15); backdrop-filter: blur(8px); border: 1.5px solid rgba(244,239,230,0.35); display: flex; align-items: center; justify-content: center; }
    @keyframes wordPop { 0%{transform:scale(0.88);opacity:0.5} 55%{transform:scale(1.07)} 100%{transform:scale(1);opacity:1} }
    .word-lit { display:inline-block; background:var(--accent); color:var(--ink); border-radius:8px; padding:0 6px 2px; animation:wordPop 0.18s cubic-bezier(.34,1.56,.64,1) both; }
    .word-dim { display:inline-block; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>

  <script type="text/babel">
    // ─── Illustrations ─────────────────────────────────────────────────────────

    const Logo = ({ size = 28 }) => (
      <div style={{ display: "inline-flex", alignItems: "center", gap: 10 }}>
        <svg width={size} height={size} viewBox="0 0 32 32" aria-hidden="true">
          <rect x="0" y="0" width="32" height="32" rx="8" fill="var(--accent)" />
          <path d="M8 9 L16 23 L24 9" stroke="#0E0D0B" strokeWidth="3.5" fill="none" strokeLinecap="round" strokeLinejoin="round" />
          <circle cx="16" cy="9" r="2" fill="#0E0D0B" />
        </svg>
        <span style={{ fontFamily: "var(--display)", fontWeight: 800, fontSize: 19, letterSpacing: "-0.03em", color: "var(--cream)" }}>
          vidconvert<span style={{ color: "var(--accent)" }}>.</span>
        </span>
      </div>
    );

    const Star = ({ size = 60, color = "var(--accent)", spikes = 12 }) => {
      const pts = [];
      for (let i = 0; i < spikes * 2; i++) {
        const r = i % 2 === 0 ? 48 : 24;
        const a = (i * Math.PI) / spikes - Math.PI / 2;
        pts.push(`${50 + Math.cos(a) * r},${50 + Math.sin(a) * r}`);
      }
      return <svg width={size} height={size} viewBox="0 0 100 100"><polygon points={pts.join(" ")} fill={color} /></svg>;
    };

    const Funnel = () => (
      <svg viewBox="0 0 280 320" style={{ width: "100%", height: "auto", display: "block" }}>
        <path d="M30 40 L250 40 L170 180 L170 280 L110 280 L110 180 Z" fill="var(--c-blue)" stroke="#0E0D0B" strokeWidth="3" strokeLinejoin="round" />
        <rect x="40" y="56" width="200" height="22" fill="var(--accent)" stroke="#0E0D0B" strokeWidth="3" />
        <rect x="58" y="92" width="164" height="22" fill="var(--c-coral)" stroke="#0E0D0B" strokeWidth="3" />
        <rect x="78" y="128" width="124" height="22" fill="var(--c-mint)" stroke="#0E0D0B" strokeWidth="3" />
        <circle cx="140" cy="300" r="10" fill="var(--accent)" stroke="#0E0D0B" strokeWidth="3" />
        <g transform="translate(80,12) rotate(-12)"><circle r="9" fill="var(--accent)" stroke="#0E0D0B" strokeWidth="2.5" /><text textAnchor="middle" y="3" fontFamily="JetBrains Mono" fontWeight="700" fontSize="9" fill="#0E0D0B">$</text></g>
        <g transform="translate(160,4) rotate(8)"><circle r="9" fill="var(--accent)" stroke="#0E0D0B" strokeWidth="2.5" /><text textAnchor="middle" y="3" fontFamily="JetBrains Mono" fontWeight="700" fontSize="9" fill="#0E0D0B">$</text></g>
        <g transform="translate(220,18) rotate(-4)"><circle r="9" fill="var(--accent)" stroke="#0E0D0B" strokeWidth="2.5" /><text textAnchor="middle" y="3" fontFamily="JetBrains Mono" fontWeight="700" fontSize="9" fill="#0E0D0B">$</text></g>
      </svg>
    );

    const Puzzle = () => (
      <svg viewBox="0 0 320 240" style={{ width: "100%", height: "auto", display: "block" }}>
        <path d="M20 40 L130 40 L130 80 Q150 80 150 100 Q150 120 130 120 L130 200 L20 200 Z" fill="var(--c-coral)" stroke="#0E0D0B" strokeWidth="3" strokeLinejoin="round" />
        <path d="M170 40 L300 40 L300 200 L170 200 L170 140 Q150 140 150 120 Q150 100 170 100 Z" fill="var(--accent)" stroke="#0E0D0B" strokeWidth="3" strokeLinejoin="round" />
        <circle cx="60" cy="80" r="5" fill="#0E0D0B" /><circle cx="60" cy="100" r="5" fill="#0E0D0B" />
        <circle cx="240" cy="60" r="5" fill="#0E0D0B" /><circle cx="240" cy="80" r="5" fill="#0E0D0B" />
      </svg>
    );

    const BarChart = () => (
      <svg viewBox="0 0 280 220" style={{ width: "100%", height: "auto", display: "block" }}>
        <rect x="20" y="120" width="40" height="80" fill="var(--c-mint)" stroke="#0E0D0B" strokeWidth="3" />
        <rect x="80" y="80" width="40" height="120" fill="var(--accent)" stroke="#0E0D0B" strokeWidth="3" />
        <rect x="140" y="40" width="40" height="160" fill="var(--c-coral)" stroke="#0E0D0B" strokeWidth="3" />
        <rect x="200" y="20" width="40" height="180" fill="var(--c-blue)" stroke="#0E0D0B" strokeWidth="3" />
        <path d="M30 30 L240 30" stroke="#0E0D0B" strokeWidth="3" strokeDasharray="6 6" />
        <path d="M232 22 L248 30 L232 38 Z" fill="#0E0D0B" />
      </svg>
    );

    const Target = () => (
      <svg viewBox="0 0 280 280" style={{ width: "100%", height: "auto", display: "block" }}>
        <circle cx="140" cy="140" r="120" fill="var(--c-blue)" stroke="#0E0D0B" strokeWidth="3" />
        <circle cx="140" cy="140" r="80" fill="var(--cream)" stroke="#0E0D0B" strokeWidth="3" />
        <circle cx="140" cy="140" r="44" fill="var(--accent)" stroke="#0E0D0B" strokeWidth="3" />
        <circle cx="140" cy="140" r="14" fill="#0E0D0B" />
        <g transform="translate(140 140) rotate(-30)">
          <path d="M-90 0 L60 0" stroke="#0E0D0B" strokeWidth="5" strokeLinecap="round" />
          <path d="M50 -10 L70 0 L50 10 Z" fill="#0E0D0B" />
        </g>
      </svg>
    );

    const Bolt = ({ size = 60 }) => (
      <svg width={size} height={size} viewBox="0 0 60 60">
        <path d="M32 4 L10 34 L26 34 L20 56 L48 22 L32 22 Z" fill="var(--accent)" stroke="#0E0D0B" strokeWidth="2.5" strokeLinejoin="round" />
      </svg>
    );

    const Smiley = ({ size = 60, color = "var(--accent)" }) => (
      <svg width={size} height={size} viewBox="0 0 60 60">
        <circle cx="30" cy="30" r="26" fill={color} stroke="#0E0D0B" strokeWidth="2.5" />
        <circle cx="22" cy="24" r="3" fill="#0E0D0B" />
        <circle cx="38" cy="24" r="3" fill="#0E0D0B" />
        <path d="M19 36 Q30 46 41 36" stroke="#0E0D0B" strokeWidth="3" fill="none" strokeLinecap="round" />
      </svg>
    );

    const Avatar = ({ initials, color }) => (
      <svg width="48" height="48" viewBox="0 0 48 48">
        <circle cx="24" cy="24" r="22" fill={color} stroke="#0E0D0B" strokeWidth="2" />
        <text x="24" y="29" textAnchor="middle" fontFamily="Bricolage Grotesque" fontWeight="800" fontSize="16" fill="#0E0D0B" letterSpacing="-0.04em">{initials}</text>
      </svg>
    );

    // ─── Video card (hover-to-play) ────────────────────────────────────────────

    const VideoCard = ({ src, title, tag, autoPlay: auto = false, style: extraStyle = {} }) => {
      const ref = React.useRef(null);

      React.useEffect(() => {
        const v = ref.current;
        if (!v) return;
        const show = () => { v.currentTime = 0.001; };
        v.addEventListener("loadedmetadata", show);
        return () => v.removeEventListener("loadedmetadata", show);
      }, []);

      const doPlay = () => ref.current?.play().catch(() => {});
      const doPause = () => {
        if (ref.current) { ref.current.pause(); ref.current.currentTime = 0.001; }
      };

      return (
        <div className="video-card" style={extraStyle}
          onMouseEnter={doPlay} onMouseLeave={doPause} onClick={doPlay}>
          <video ref={ref} src={src} muted playsInline preload="metadata" loop
            autoPlay={auto}
            style={{ width: "100%", height: "100%", objectFit: "cover", display: "block" }} />
          <div className="vc-overlay">
            <div style={{ fontFamily: "var(--mono)", fontSize: 10, letterSpacing: "0.1em", textTransform: "uppercase", color: "var(--accent)", marginBottom: 5 }}>{tag}</div>
            <div className="display" style={{ fontSize: 17, fontWeight: 700, letterSpacing: "-0.02em" }}>{title}</div>
          </div>
          {!auto && (
            <div className="vc-play">
              <div className="vc-play-btn">
                <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
                  <path d="M5 3L15 9L5 15V3Z" fill="var(--cream)" />
                </svg>
              </div>
            </div>
          )}
        </div>
      );
    };

    // ─── Nav ───────────────────────────────────────────────────────────────────

    const Nav = () => (
      <nav style={{ position: "sticky", top: 0, zIndex: 50, background: "rgba(14,13,11,0.72)", backdropFilter: "blur(14px)", borderBottom: "1px solid var(--line)" }}>
        <div className="container flex items-center justify-between" style={{ height: 72 }}>
          <div className="flex items-center gap-4">
            <Logo />
            <a href="https://www.instagram.com/lockeemclaughlin/" target="_blank" rel="noopener noreferrer"
               aria-label="Instagram — @lockeemclaughlin"
               className="flex items-center gap-2"
               style={{
                 background: "var(--accent)", color: "var(--ink)",
                 padding: "8px 14px", borderRadius: 999,
                 fontWeight: 800, fontSize: 13, letterSpacing: "-0.01em",
                 border: "2px solid var(--ink)",
                 fontFamily: "var(--display)",
               }}>
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true">
                <rect x="2" y="2" width="20" height="20" rx="5" ry="5" />
                <path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z" />
                <line x1="17.5" y1="6.5" x2="17.5" y2="6.5" />
              </svg>
              <span>@lockeemclaughlin</span>
            </a>
          </div>
          <div className="flex items-center gap-8" style={{ fontSize: 14 }}>
            <a href="#approach" style={{ opacity: 0.8 }}>Approach</a>
            <a href="#process" style={{ opacity: 0.8 }}>Process</a>
            <a href="#work" style={{ opacity: 0.8 }}>Work</a>
            <a href="#voices" style={{ opacity: 0.8 }}>Voices</a>
            <a href="#founder" style={{ opacity: 0.8 }}>About</a>
          </div>
          <a href="#cta" className="btn btn-primary" style={{ padding: "12px 18px", fontSize: 14 }}>Book a strategy call →</a>
        </div>
      </nav>
    );

    // ─── Hero ──────────────────────────────────────────────────────────────────

    const Hero = () => {
      const lines = [
        ["We", "turn", "ad", "spend"],
        ["into", "compounding", "growth"],
        ["for", "impactful", "brands."],
      ];
      const allWords = lines.flat();
      const colors = ["var(--c-coral)", "var(--c-blue)", "var(--accent)", "var(--c-mint)"];
      const [lit, setLit] = React.useState(-1);

      React.useEffect(() => {
        let i = 0;
        let timer;
        const tick = () => {
          setLit(i);
          i++;
          if (i < allWords.length) timer = setTimeout(tick, 280);
        };
        const init = setTimeout(tick, 350);
        return () => { clearTimeout(init); clearTimeout(timer); };
      }, []);

      let wordIdx = 0;
      return (
      <section className="bg-dots" style={{ paddingTop: 80, paddingBottom: 100, position: "relative", overflow: "hidden" }}>
        {/* floating stickers */}
        <div style={{ position: "absolute", top: 110, left: "6%", transform: "rotate(-8deg)" }}><Star size={56} color="var(--c-coral)" spikes={10} /></div>
        <div style={{ position: "absolute", top: 380, left: "3%", transform: "rotate(14deg)" }}><Smiley size={48} color="var(--c-mint)" /></div>
        <div style={{ position: "absolute", top: 200, right: "5%", transform: "rotate(8deg)" }}><Bolt size={62} /></div>

        <div className="container">
          <div className="flex items-center gap-3" style={{ marginBottom: 28 }}>
            <span className="chip">
              <span style={{ width:6, height:6, borderRadius:99, background:"var(--c-mint)", boxShadow:"0 0 0 3px rgba(124,255,107,0.18)" }} />
              {" "}Booking Q3 — 2 spots left
            </span>
            <span className="chip" style={{ borderColor: "var(--line)" }}>Meta Business Partner</span>
          </div>

          <h1 className="display h-xl" style={{ maxWidth: 1100, margin: 0, lineHeight: 1.08 }}>
            {lines.map((line, li) => (
              <span key={li} style={{ display: "block" }}>
                {line.map((word) => {
                  const idx = wordIdx++;
                  const active = idx <= lit;
                  const color = colors[idx % colors.length];
                  return (
                    <React.Fragment key={idx}>
                      <span key={active ? `lit-${idx}` : `dim-${idx}`}
                        className={active ? "word-lit" : "word-dim"}
                        style={active ? { background: color } : {}}>
                        {word}
                      </span>
                      {" "}
                    </React.Fragment>
                  );
                })}
              </span>
            ))}
          </h1>

          <div className="flex items-center gap-8" style={{ marginTop: 44, flexWrap: "wrap" }}>
            <a href="#cta" className="btn btn-primary">Get your free growth audit <span aria-hidden="true">→</span></a>
            <a href="#work" className="btn btn-ghost">See the work</a>
          </div>

          {/* Hero video grid */}
          <div className="hero-grid" style={{ marginTop: 72, display: "grid", gridTemplateColumns: "1.4fr 1fr", gap: 20, alignItems: "stretch", minHeight: 380 }}>
            {/* Left — Soiré featured reel */}
            <div style={{ background: "var(--bg-2)", border: "1px solid var(--line)", borderRadius: 24, overflow: "hidden", display: "flex", flexDirection: "column" }}>
              <div className="flex items-center justify-between" style={{ padding: "14px 20px", flexShrink: 0 }}>
                <span className="eyebrow">Soiré · 2026</span>
                <span className="chip" style={{ background: "var(--accent)", color: "#0E0D0B", borderColor: "var(--accent)", fontWeight: 700, fontSize: 11 }}>
                  ▶ Reel
                </span>
              </div>
              <div style={{ flex: 1, position: "relative", overflow: "hidden", minHeight: 240 }}>
                <video src="videos/soire-fancy.mp4" autoPlay muted loop playsInline
                  style={{ position: "absolute", inset: 0, width: "100%", height: "100%", objectFit: "cover" }} />
              </div>
            </div>

            {/* Right — Chi O Fundraiser + Unlock Patients */}
            <div style={{ display: "grid", gap: 20, gridTemplateRows: "1fr 1fr" }}>
              <VideoCard src="videos/chi-o-fundraiser.mp4" title="Make-A-Wish Fundraiser" tag="Event" autoPlay={true}
                style={{ borderRadius: 24, aspectRatio: "unset", minHeight: 0 }} />
              <VideoCard src="videos/ad-cinematography.mp4" title="Unlock Patients" tag="Commercial" autoPlay={true}
                style={{ borderRadius: 24, aspectRatio: "unset", minHeight: 0 }} />
            </div>
          </div>
        </div>

        <style>{`@media(max-width:880px){.hero-grid{grid-template-columns:1fr!important}}`}</style>
      </section>
      );
    };

    // ─── Client Bar ────────────────────────────────────────────────────────────

    const ClientBar = () => {
      const clients = ["Unlock Patients","Jessie Lane Interiors","Not Enough Attire","Chi O","Northbound Co.","Folkpine","Halfmoon Goods","Merit & Co"];
      return (
        <section style={{ padding: "48px 0", borderTop: "1px solid var(--line)", borderBottom: "1px solid var(--line)" }}>
          <div className="container" style={{ marginBottom: 28 }}>
            <div className="text-center muted" style={{ fontSize: 13, fontFamily: "var(--mono)", letterSpacing: "0.14em", textTransform: "uppercase" }}>
              Trusted by ambitious teams shipping real products
            </div>
          </div>
          <div className="marquee">
            <div className="marquee-track">
              {[...clients,...clients].map((c, i) => (
                <span key={i} style={{
                  fontFamily: "var(--display)", fontWeight: 700, fontSize: "clamp(22px, 2.6vw, 36px)",
                  letterSpacing: "-0.03em", color: "var(--cream)", opacity: 0.7,
                  display: "inline-flex", alignItems: "center", gap: 64
                }}>
                  {c}
                  <span style={{ width: 8, height: 8, borderRadius: 99, background: "var(--accent)", display: "inline-block" }} />
                </span>
              ))}
            </div>
          </div>
        </section>
      );
    };

    // ─── Approach ──────────────────────────────────────────────────────────────

    const ApproachCard = ({ eyebrow, title, body, tag, color, art }) => (
      <div style={{ background: "var(--cream-2)", border: "2px solid var(--ink)", borderRadius: 22, padding: 24, display: "flex", flexDirection: "column", minHeight: 460 }}>
        <div className="flex items-center justify-between" style={{ marginBottom: 16 }}>
          <span style={{ fontFamily: "var(--mono)", fontSize: 11, letterSpacing: "0.12em", textTransform: "uppercase", color: "#3A3730" }}>{eyebrow}</span>
          <span style={{ background: color, color: "var(--ink)", border: "2px solid var(--ink)", padding: "3px 10px", borderRadius: 99, fontFamily: "var(--mono)", fontSize: 11, fontWeight: 700, letterSpacing: "0.04em", textTransform: "uppercase" }}>{tag}</span>
        </div>
        <div style={{ flex: 1, padding: "12px 0", display: "flex", alignItems: "center", justifyContent: "center", minHeight: 200 }}>{art}</div>
        <h3 className="display" style={{ fontSize: 26, lineHeight: 1.05, margin: 0, marginBottom: 10 }}>{title}</h3>
        <p style={{ margin: 0, fontSize: 15, color: "#3A3730", lineHeight: 1.5 }}>{body}</p>
      </div>
    );

    const Approach = () => (
      <section id="approach" className="section section-cream">
        <div className="container">
          <div className="flex items-center justify-between" style={{ marginBottom: 64, flexWrap: "wrap", gap: 24 }}>
            <div style={{ maxWidth: 720 }}>
              <span className="eyebrow">Our approach</span>
              <h2 className="display h-lg" style={{ marginTop: 18, marginBottom: 0 }}>
                We sit at the intersection of{" "}
                <span className="hi" style={{ background: "var(--c-coral)", color: "var(--cream)" }}>science</span>{" "}
                &amp;{" "}
                <span className="hi" style={{ background: "var(--c-blue)", color: "var(--cream)" }}>style</span>.
              </h2>
            </div>
            <div style={{ maxWidth: 380, fontSize: 17, color: "#3A3730" }}>
              Most agencies are great at one or the other. Beautiful creative that doesn&rsquo;t convert,
              or hard-charging media buying that looks like everyone else. <strong>We refuse to pick one.</strong>
            </div>
          </div>
          <div className="approach-grid" style={{ display: "grid", gridTemplateColumns: "1fr 1fr 1fr", gap: 20 }}>
            <ApproachCard eyebrow="01 — Science" title="Test, learn, deploy capital"
              body="Structured testing frameworks. We make small bets every week so we can confidently double down on the winners."
              tag="Media" color="var(--c-blue)" art={<BarChart />} />
            <ApproachCard eyebrow="02 — Style" title="Creative that earns the click"
              body="Native-feeling, scroll-stopping ads built for the platform — not retrofitted from a TV spot."
              tag="Creative" color="var(--c-coral)" art={<Funnel />} />
            <ApproachCard eyebrow="03 — System" title="Build a flywheel, not a campaign"
              body="Performance compounds when creative, audiences and offer are tuned together. We build all three."
              tag="Strategy" color="var(--accent)" art={<Puzzle />} />
          </div>
          <style>{`@media(max-width:880px){.approach-grid{grid-template-columns:1fr!important}}`}</style>
        </div>
      </section>
    );

    // ─── Banner ────────────────────────────────────────────────────────────────

    const Banner = () => {
      const items = ["Meta Ads","✺","Creative Production","✺","Landing Pages","✺","Lifecycle","✺","Analytics","✺"];
      return (
        <section style={{ background: "var(--accent)", color: "var(--ink)", padding: "28px 0", overflow: "hidden", borderTop: "2px solid var(--ink)", borderBottom: "2px solid var(--ink)" }}>
          <div className="marquee">
            <div className="marquee-track" style={{ animationDuration: "30s" }}>
              {[...items,...items,...items].map((c, i) => (
                <span key={i} className="display" style={{ fontWeight: 800, fontSize: "clamp(28px, 4vw, 56px)", letterSpacing: "-0.03em" }}>{c}</span>
              ))}
            </div>
          </div>
        </section>
      );
    };

    // ─── Process ───────────────────────────────────────────────────────────────

    const Process = () => {
      const [active, setActive] = React.useState(0);
      const steps = [
        { n:"01", title:"Audit & diagnose", sub:"Week 1", body:"We pull the curtain back on your account, creative library, funnel and offer. You get a detailed teardown — yours to keep, even if we never work together.", bullets:["Account health & wasted spend","Creative scoring","Funnel friction map"], art:<Target />, tint:"var(--c-blue)" },
        { n:"02", title:"Build the engine", sub:"Weeks 2–4", body:"We rebuild your account architecture for compounding learning. New campaign structure, a creative testing matrix, and a measurement plan you can actually trust.", bullets:["Campaign restructure","Creative testing matrix","Server-side tracking"], art:<Funnel />, tint:"var(--accent)" },
        { n:"03", title:"Scale with discipline", sub:"Month 2+", body:"Three creative concepts shipped per week. Weekly profit reviews. Quarterly offer & landing page tests. The boring stuff that quietly compounds.", bullets:["3 new concepts / week","Weekly profit review","Quarterly offer tests"], art:<BarChart />, tint:"var(--c-mint)" },
        { n:"04", title:"Hand back a flywheel", sub:"Always", body:"Every system we build is documented and yours. No black boxes, no agency hostage situations. Stay because you want to — not because you have to.", bullets:["Full documentation","Trained internal team","Transparent reporting"], art:<Puzzle />, tint:"var(--c-coral)" },
      ];

      return (
        <section id="process" className="section bg-dots" style={{ position: "relative" }}>
          <div className="container">
            <div style={{ maxWidth: 760, marginBottom: 64 }}>
              <span className="eyebrow">How we work</span>
              <h2 className="display h-lg" style={{ marginTop: 18, marginBottom: 18 }}>
                A process built for{" "}
                <span style={{ position: "relative", display: "inline-block" }}>
